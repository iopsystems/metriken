[package]
name = "metriken-segment"
version = "0.1.3"
edition = "2021"
authors = [
    "Brian Martin <brian@iop.systems>",
]
license = "MIT OR Apache-2.0"
description = "The parquet segment format for metriken metrics: long layout and occupant streams"
homepage = "https://github.com/iopsystems/metriken"
repository = "https://github.com/iopsystems/metriken"

[dependencies]
arrow.workspace = true
bytes = "1"
histogram.workspace = true
metriken = { version = "0.11.1", path = "../metriken", optional = true }
parquet = { workspace = true, features = ["arrow"] }
rmp-serde = "1.3"
serde.workspace = true
tracing = { version = "0.1", default-features = false, features = ["std"] }

[features]
default = ["lz4"]
# `From` conversions between `metriken::Window` and this crate's `Window`.
# Off by default: `metriken` pulls in the registry, which does not build for
# wasm32.
metriken = ["dep:metriken"]
# Reading segments written with LZ4_RAW, the codec rezolus writes.
lz4 = ["parquet/lz4"]
