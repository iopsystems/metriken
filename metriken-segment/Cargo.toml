[package]
name = "metriken-segment"
version = "0.2.0"
edition = "2021"
authors = [
    "Brian Martin <brian@iop.systems>",
]
license = "MIT OR Apache-2.0"
description = "Renamed to metriken-storage; this crate re-exports it"
homepage = "https://github.com/iopsystems/metriken"
repository = "https://github.com/iopsystems/metriken"

[dependencies]
metriken-storage = { version = "0.1.0", path = "../metriken-storage", default-features = false }

[features]
default = ["lz4"]
lz4 = ["metriken-storage/lz4"]
metriken = ["metriken-storage/metriken"]
