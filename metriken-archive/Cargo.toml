[package]
name = "metriken-archive"
version = "0.1.0"
edition = "2021"
authors = [
    "Brian Martin <brian@iop.systems>",
]
license = "MIT OR Apache-2.0"
description = "Archives of metriken metrics read as one PromQL source per recording"
homepage = "https://github.com/iopsystems/metriken"
repository = "https://github.com/iopsystems/metriken"

[dependencies]
bytes = "1"
dendro = { version = "0.3.1", default-features = false }
metriken-query = { version = "0.33.0", path = "../metriken-query", default-features = false, features = ["lz4"] }
parquet = { version = "58.2.0", default-features = false, features = ["arrow", "lz4"] }
metriken-segment = { version = "0.1.2", path = "../metriken-segment", default-features = false, features = ["lz4"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
