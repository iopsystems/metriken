[package]
name = "metriken"
version = "0.11.3"
edition = "2021"
authors = ["Brian Martin <brian@iop.systems>", "Sean Lynch <sean@iop.systems>"]
license = "Apache-2.0"
description = "A fast and lightweight metrics library"
homepage = "https://github.com/iopsystems/metriken"
repository = "https://github.com/iopsystems/metriken"

[features]
serde = ["metriken-core/serde"]

[dependencies]
metriken-core   = { version = "0.3.3",  path = "../metriken-core" }
metriken-derive = { version = "=0.6.0", path = "../metriken-derive" }
metriken-types  = { version = "0.1.0",  path = "../metriken-types" }

histogram.workspace = true
getrandom = "0.3"
once_cell = "1.14.0"
parking_lot.workspace = true

[dev-dependencies]
trybuild = "1.0"
