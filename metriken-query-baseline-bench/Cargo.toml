[package]
name = "metriken-query-baseline-bench"
version = "0.1.0"
edition = "2021"
publish = false
description = "Baseline benchmarks against metriken-query 0.10.8 (pre-streaming refactor)"

[dependencies]
metriken-query = { version = "0.10.8", default-features = false }
sysinfo = "0.32"

[[bin]]
name = "baseline-memory"
path = "src/baseline_memory.rs"

[[bin]]
name = "baseline-latency"
path = "src/baseline_latency.rs"
