[package]
name = "metriken-storage"
version = "0.1.0"
edition = "2021"
authors = [
    "Brian Martin <brian@iop.systems>",
]
license = "MIT OR Apache-2.0"
description = "Storage for metriken recordings: the parquet segment format, long tables and occupant streams"
homepage = "https://github.com/iopsystems/metriken"
repository = "https://github.com/iopsystems/metriken"

[dependencies]
arrow.workspace = true
bytes = "1"
dendro = { version = "0.3.4", default-features = false }
foldhash = "0.2.0"
lru = "0.12"
metriken-exposition = { version = "0.21.5", path = "../metriken-exposition", default-features = false, features = ["segment", "msgpack"], optional = true }
twox-hash = { version = "2", default-features = false, features = ["xxhash3_128"] }
histogram.workspace = true
metriken = { version = "0.11.3", path = "../metriken", optional = true }
metriken-model = { version = "0.1.1", path = "../metriken-model" }
metriken-types = { version = "0.1.0", path = "../metriken-types" }
parquet = { workspace = true, features = ["arrow", "lz4", "zstd"] }
rmp-serde = "1.3"
rmp = "0.8"
rusqlite = { version = "0.40", features = ["bundled", "blob", "serialize"], optional = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true, optional = true }
tar = { version = "0.4.45", default-features = false, optional = true }
tempfile = { workspace = true, optional = true }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
# The archive's integration tests query through the engine; an integration
# test links the same metriken-storage that metriken-query does. A unit test
# does not (it builds this crate a second time), so unit tests that query
# live in metriken-query. Path-only, so `cargo publish` strips it.
metriken-query = { path = "../metriken-query", features = ["fixtures"] }
serde_json.workspace = true
tempfile.workspace = true
metriken = { path = "../metriken" }
metriken-exposition = { path = "../metriken-exposition" }
dendro = { version = "0.3.4" }

[features]
default = ["lz4"]
# The `.rez` archive format: reading it, and with `write` its writers.
rez = ["dep:rusqlite", "dep:serde_json", "dep:tar", "dep:tempfile"]
# Fixture builders other crates' tests use (the tar `.rez` writer).
test-support = ["rez", "write"]
# Loading `metriken-model` snapshots into an in-memory source.
ingest = []
# Requires `metriken` 0.11.3, whose `Window` is `metriken-types`' type, the
# same as this crate's, so `.into()` between them is the identity
# conversion. Off by default: `metriken` pulls in the registry, which does not
# build for wasm32.
metriken = ["dep:metriken"]
# The archive writer, over dendro's. Off, this crate is a reader.
write = ["dendro/write"]
# A producer's groups as dendro replication frames (`stream::FrameProducer`).
# Separate from `write`: a producer serving a stream needs neither the
# archive writer nor dendro's.
stream = ["dep:metriken-exposition", "dep:metriken"]
# Reading segments written with LZ4_RAW, the codec rezolus writes.
lz4 = ["parquet/lz4"]
