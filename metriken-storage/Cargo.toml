[package]
name = "metriken-storage"
version = "0.5.3"
edition = "2021"
authors = [
    "Brian Martin <brian@iop.systems>",
]
license = "MIT OR Apache-2.0"
description = "Storage for metriken recordings: the segment format, column readers, the dendro archive, and reading .rez archives"
homepage = "https://github.com/iopsystems/metriken"
repository = "https://github.com/iopsystems/metriken"
# The integration tests query through metriken-query, a path-only
# dev-dependency that publishing strips, so they cannot build from the package.
exclude = ["tests/"]

[dependencies]
arrow.workspace = true
bytes = "1"
dendro = { version = "0.6.0", default-features = false, features = ["archive"], optional = true }
foldhash = "0.2.0"
lru = "0.18.5"
metriken-exposition = { version = "0.25.0", path = "../metriken-exposition", default-features = false, features = ["stream"], optional = true }
twox-hash = { version = "2", default-features = false, features = ["xxhash3_128"] }
histogram.workspace = true
metriken = { version = "0.11.3", path = "../metriken", optional = true }
metriken-model = { version = "0.2.0", path = "../metriken-model" }
metriken-types = { version = "0.1.0", path = "../metriken-types" }
parquet = { workspace = true, features = ["arrow", "lz4", "zstd"] }
rmp-serde = "1.3"
rmp = "0.8"
rusqlite = { version = "0.40", features = ["bundled", "blob", "serialize"], optional = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true, optional = true }
tar = { version = "0.4.45", default-features = false, optional = true }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
# The archive's integration tests query through the engine; an integration
# test links the same metriken-storage that metriken-query does. A unit test
# does not (it builds this crate a second time), so unit tests that query
# live in metriken-query. Path-only, so `cargo publish` strips it.
metriken-query = { path = "../metriken-query", features = ["fixtures"] }
serde_json.workspace = true
tempfile.workspace = true
metriken = { path = "../metriken" }
metriken-exposition = { path = "../metriken-exposition" }
dendro = { version = "0.6.0" }

[features]
default = ["lz4", "archive"]
# The dendro archive: its catalog, `ArchiveReader`, the segment encoder and
# the column filter. Off, nothing here compiles SQLite: the segment format,
# the column readers and, with `convert`, the parquet conversion.
archive = ["dep:dendro", "dep:serde_json"]
# Reading the `.rez` archive format (v1/v2 tar, v3 SQLite), and with `write`
# converting a v3 `.rez` to a dendro archive. Nothing writes a `.rez`.
rez = ["archive", "dep:rusqlite", "dep:serde_json", "dep:tar"]
# Loading `metriken-model` snapshots into an in-memory source.
ingest = []
# Requires `metriken` 0.11.3, whose `Window` is `metriken-types`' type, the
# same as this crate's, so `.into()` between them is the identity
# conversion. Off by default: `metriken` pulls in the registry, which does not
# build for wasm32.
metriken = ["dep:metriken"]
# The archive writer, over dendro's. Off, this crate is a reader.
write = ["archive", "dendro/write"]
# `metriken_exposition::stream` at `stream`, re-exported until the next
# breaking release, and `StreamRow`/`Pass` for the row wire's
# `AgentRow`/`AgentRows` (`rez::wire`).
stream = ["dep:metriken-exposition"]
# `MsgpackToArchive`: a raw msgpack recording into a `.dendro` archive
# (`convert`), through the archive writer.
convert = ["write"]
# Reading segments written with LZ4_RAW, the codec rezolus writes.
lz4 = ["parquet/lz4"]

[package.metadata.docs.rs]
all-features = true
