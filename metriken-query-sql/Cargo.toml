[package]
name = "metriken-query-sql"
version = "0.1.0"
edition = "2021"
authors = [
    "Brian Martin <brian@iop.systems>",
    "Yao Yue <yao@iop.systems>",
    "Yuri Vishnevsky <yuri@iop.systems>",
]
license = "MIT OR Apache-2.0"
description = "DuckDB-backed SQL query engine + H2 histogram UDFs for metriken parquet files"
homepage = "https://github.com/iopsystems/metriken"
repository = "https://github.com/iopsystems/metriken"
publish = false

[dependencies]
arrow.workspace = true
bytes = "1"
# `parquet` statically links DuckDB's parquet extension into libduckdb
# instead of leaving it as an autoload-at-runtime extension. Without
# this, the first `read_parquet(...)` triggers DuckDB's extension
# installer which fails on Windows CI ("Could not move file: Access is
# denied") and on any sandbox where the extension cache dir isn't
# writable. Statically linked it Just Works on every platform.
duckdb = { version = "1.1.1", features = ["bundled", "vscalar", "parquet"] }
parquet = { workspace = true, default-features = false, features = ["arrow", "snap", "brotli", "flate2", "flate2-rust_backened", "zstd"] }
thiserror = "2"

[dev-dependencies]
histogram.workspace = true
tempfile.workspace = true
