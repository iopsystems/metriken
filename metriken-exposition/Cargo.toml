[package]
name = "metriken-exposition"
version = "0.21.5"
edition = "2021"
authors = [
    "Brian Martin <brian@iop.systems>",
    "Sean Lynch <sean@iop.systems>",
]
license = "MIT OR Apache-2.0"
description = "Exposition for metriken metrics"
homepage = "https://github.com/iopsystems/metriken"
repository = "https://github.com/iopsystems/metriken"

[dependencies]
arrow = { workspace = true, optional = true }
chrono = "0.4.44"
foldhash = { version = "0.2.0", optional = true }
histogram.workspace = true
metriken = { version = "0.11.3", path = "../metriken" }
metriken-model = { version = "0.1.1", path = "../metriken-model" }
metriken-types = { version = "0.1.0", path = "../metriken-types" }
parquet = { workspace = true, optional = true, features = ["arrow", "zstd"] }
rmp-serde = { version = "1.3.0", optional = true }
serde = { workspace = true, optional = true, features = ["rc"] }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[features]
default = ["parquet-conversion", "segment"]
# `group_approx_bytes` and the `wal_group_row` re-export.
segment = ["serde"]
serde = ["dep:serde", "chrono/serde", "histogram/serde", "metriken/serde"]
json = ["serde", "dep:serde_json", "metriken-model/json"]
msgpack = ["serde", "dep:rmp-serde", "dep:foldhash"]
parquet = ["dep:arrow", "dep:parquet"]
parquet-conversion = ["serde", "msgpack", "parquet"]
