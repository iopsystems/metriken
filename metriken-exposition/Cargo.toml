[package]
name = "metriken-exposition"
version = "0.23.1"
edition = "2021"
authors = [
    "Brian Martin <brian@iop.systems>",
    "Sean Lynch <sean@iop.systems>",
]
license = "MIT OR Apache-2.0"
description = "Exposition for metriken metrics"
homepage = "https://github.com/iopsystems/metriken"
repository = "https://github.com/iopsystems/metriken"

[dependencies]
bytes = { version = "1", optional = true }
chrono = "0.4.44"
dendro = { version = "0.5.0", default-features = false, optional = true }
foldhash = { version = "0.2.0", optional = true }
futures-core = { version = "0.3", default-features = false, optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
histogram.workspace = true
humantime = { version = "2", optional = true }
metriken = { version = "0.11.3", path = "../metriken" }
metriken-model = { version = "0.1.3", path = "../metriken-model" }
metriken-types = { version = "0.1.0", path = "../metriken-types" }
rmp-serde = { version = "1.3.0", optional = true }
serde = { workspace = true, optional = true, features = ["rc"] }
serde_json = { workspace = true, optional = true }
tokio = { version = "1", default-features = false, features = ["time"], optional = true }
tracing = { version = "0.1", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
# The frame tests apply frames through dendro's subscriber into an archive.
dendro = { version = "0.5.0" }
futures-util = { version = "0.3", default-features = false }
tempfile.workspace = true
tokio = { version = "1", features = ["macros", "rt", "time", "test-util"] }

[features]
default = ["msgpack", "segment"]
# `group_approx_bytes` and the `wal_group_row` re-export.
segment = ["serde"]
serde = ["dep:serde", "chrono/serde", "histogram/serde", "metriken/serde"]
json = ["serde", "dep:serde_json", "metriken-model/json"]
msgpack = ["serde", "dep:rmp-serde", "dep:foldhash"]
# A producer's groups as dendro replication frames, and the
# `/metrics/stream` route helper (`stream`). No HTTP framework, no async
# runtime, and no SQLite: dendro without its `archive` feature.
stream = ["msgpack", "dep:dendro", "dep:bytes", "dep:humantime", "dep:tracing"]
# `StreamSubscription::into_stream`, the subscription as a body stream on
# tokio's timer.
stream-tokio = ["stream", "dep:tokio", "dep:futures-core", "dep:futures-util"]

[package.metadata.docs.rs]
all-features = true
