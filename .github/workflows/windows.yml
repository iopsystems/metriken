# The test suite on Windows. It takes four to five times as long as on Linux
# and macOS, so it runs after merge and nightly instead of on pull requests,
# and is not part of `verify all tests pass`. To test a branch on Windows
# before merging, run this workflow on it from the Actions tab.
name: windows
on:
  push:
    branches:
      main
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

env:
  RUSTUP_WINDOWS_PATH_ADD_BIN: 1

jobs:
  test:
    name: test-windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: swlynch99/cargo-sweep-action@v1
      - uses: taiki-e/install-action@cargo-nextest

      - name: cargo nextest run
        run: |
          cargo nextest run         \
            --locked                \
            --all-targets           \
            --all-features          \
            --no-fail-fast          \
            --success-output final  \
            --final-status-level skip
        shell: bash

      - name: doctests
        run: |
          cargo test --doc  \
            --all-features  \
            --locked
        shell: bash
