
[workspace]
resolver = "2"
members = [
    "metriken",
    "metriken-charts",
    "metriken-core",
    "metriken-derive",
    "metriken-exposition",
    "metriken-query",
    "metriken-recorder",
    "metriken-model",
    "metriken-storage",
    "metriken-types",
]

[workspace.dependencies]
# Shared across multiple crates
arrow = { version = "60.0.0", default-features = false }
histogram = "1.4.1"
parquet = { version = "60.0.0", default-features = false }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
