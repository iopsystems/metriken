
[workspace]
resolver = "2"
members = [
    "metriken",
    "metriken-core",
    "metriken-derive",
    "metriken-exposition",
    "metriken-query",
    "metriken-model",
    "metriken-storage",
    "metriken-types",
]

[workspace.dependencies]
# Shared across multiple crates
arrow = { version = "58.2.0", default-features = false }
histogram = "1.4.1"
parquet = { version = "58.2.0", default-features = false }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"

# dendro 0.4.0 is merged but not yet released. This patch goes before
# metriken's release, when the requirements below move to "0.4.0".
[patch.crates-io]
dendro = { git = "https://github.com/iopsystems/dendro", rev = "8cc03eeb2f5a64d5ef35ced638c67ef2aecf2694" }
