[package]
name = "metriken-query"
version = "0.10.2"
edition = "2021"
authors = [
    "Brian Martin <brian@iop.systems>",
    "Yao Yue <yao@iop.systems>",
]
license = "MIT OR Apache-2.0"
description = "PromQL query engine and TSDB for metriken parquet files"
homepage = "https://github.com/iopsystems/metriken"
repository = "https://github.com/iopsystems/metriken"

[dependencies]
arrow.workspace = true
bytes = "1"
histogram.workspace = true
metriken-exposition = { version = "0.16.0", path = "../metriken-exposition", default-features = false, optional = true }
metriken-query-sql = { path = "../metriken-query-sql", optional = true }
parquet = { workspace = true, default-features = false, features = ["arrow", "snap", "brotli", "flate2", "flate2-rust_backened", "zstd"] }
promql-parser = { version = "0.8", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
toml = "0.8"

[dev-dependencies]
duckdb = { version = "1.1.1", features = ["bundled"] }
insta = { version = "1", features = ["json"] }
metriken-query-fixtures = { path = "../metriken-query-fixtures" }
tempfile.workspace = true
toml = "0.8"

[features]
# Default: SQL pipeline only. No legacy PromQL evaluator, no in-memory
# `Tsdb` store. Callers that still need the PromQL evaluator (Rezolus
# dashboard for `Tsdb`, Rezolus binary's server-backed query endpoint
# and live-agent ingest) opt out with `default-features = false` and
# enable `legacy` or `ingest`.
default = ["sql", "lz4"]
sql = ["dep:metriken-query-sql"]
legacy = ["dep:promql-parser"]
ingest = ["legacy", "dep:metriken-exposition"]
lz4 = ["parquet/lz4"]

[[example]]
name = "sql_vs_promql"
required-features = ["legacy", "sql"]
