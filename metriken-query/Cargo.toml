[package]
name = "metriken-query"
version = "0.10.6"
edition = "2021"
authors = [
    "Brian Martin <brian@iop.systems>",
    "Yao Yue <yao@iop.systems>",
]
license = "MIT OR Apache-2.0"
description = "PromQL query engine and TSDB for metriken parquet files"
homepage = "https://github.com/iopsystems/metriken"
repository = "https://github.com/iopsystems/metriken"

[dependencies]
arrow.workspace = true
bytes = "1"
duckdb = { version = "1.10503.1", features = ["bundled"] }
histogram.workspace = true
metriken-exposition = { version = "0.16.1", path = "../metriken-exposition", default-features = false, optional = true }
parquet = { workspace = true, features = ["arrow", "zstd"] }
promql-parser = "0.8"
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror = "2"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }

[features]
default = ["ingest", "lz4"]
ingest = ["metriken-exposition"]
lz4 = ["parquet/lz4"]
